- name: install packages
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop:
    - mysqld
    - nginx
    # - zip
  - name: start service mysql
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes
  - name: start service nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
